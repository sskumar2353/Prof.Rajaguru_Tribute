# CodeRabbit Configuration for Prof. Rajaguru Memorial Tribute Platform
language: "en-US"
tone_instructions: "Provide polite, constructive, and concise code reviews tailored for a high-quality React/Vite memorial web application."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.vercel/**"
    - "!package-lock.json"

  path_instructions:
    - path: "src/**/*.{js,jsx}"
      instructions: |
        - Ensure React 18 functional components and hooks best practices are strictly followed.
        - Verify no secret credentials (e.g. Supabase service role keys, Microsoft Graph client secrets) are present or exposed in Vite client-side code (`VITE_*`).
        - Ensure accessibility (alt tags on memorial photos, semantic HTML elements, ARIA labels).
        - Confirm imports and routing paths are clean and valid.
    - path: "src/styles/**/*.{css,module.css}"
      instructions: |
        - Adhere to the established memorial color palette (Warm ivory #F7F4ED, Soft white #FFFDF8, Muted blue #6675B5, Deep blue #303A5D, Antique gold #B08C43, Dark ink #28272B).
        - Avoid loud neon, bright magenta, or aggressive SaaS gradients.
        - Ensure responsive layout behavior across mobile, tablet, and desktop breakpoints.

chat:
  auto_reply: true
